<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title><%= htmlWebpackPlugin.options.title %></title>
    <link
      rel="stylesheet"
      type="text/css"
      href="https://d3fvh0lm0eshry.cloudfront.net/static/css/newamericadotorg.lite.css"
    />

    <!-- report content height to parent for responsive iframe -->
    <script>
      !(function () {
        function sendHeight() {
          document.documentElement.style.height = "auto";
          const h = Math.ceil(
            document.documentElement.getBoundingClientRect().height,
          );
          window.parent.postMessage({ type: "resize", height: h }, "*");
        }

        // Observe any element that changes size
        const ro = new ResizeObserver(function () {
          requestAnimationFrame(sendHeight);
        });

        // Observe the document root
        ro.observe(document.documentElement);
        ro.observe(document.body);

        // Also observe chart containers once they exist
        function observeCharts() {
          document
            .querySelectorAll(".na-dataviz, .na-dataviz *")
            .forEach(function (el) {
              ro.observe(el);
            });
        }

        window.addEventListener("load", function () {
          sendHeight();
          observeCharts();

          // MutationObserver to catch chart containers being populated
          new MutationObserver(function (mutations) {
            sendHeight();
            observeCharts(); // re-run in case new elements were added
          }).observe(document.body, { childList: true, subtree: true });
        });

        window.addEventListener("resize", function () {
          requestAnimationFrame(sendHeight);
        });
      })();
    </script>

    <script>
      window.user = { isAuthenticated: true };
    </script>
